piv_base.welcome_modal_settings:
  path: '/admin/config/system/welcome-modal-settings'
  defaults:
    _title: 'PIV Welcome modal settings'
    _form: 'Drupal\piv_base\Form\PivWelcomeModalSettingsForm'
  requirements:
    _permission: 'administer site configuration'

piv_base.teacher_survey:
  path: '/survey/teacher/{node}'
  defaults:
    _title: 'Teacher Survey'
    _controller: '\Drupal\piv_base\Controller\SurveyController::teacherForm'
  requirements:
    _custom_access: '\Drupal\piv_base\Controller\SurveyController::teacherFormAccess'

piv_base.poet_survey:
  path: '/survey/poet/{node}'
  defaults:
    _title: 'Poet Survey'
    _controller: '\Drupal\piv_base\Controller\SurveyController::poetForm'
  requirements:
    _custom_access: '\Drupal\piv_base\Controller\SurveyController::poetFormAccess'

piv_base.teacher_survey_view:
  path: '/survey/teacher/{node}/view'
  defaults:
    _title: 'Teacher Survey'
    _controller: '\Drupal\piv_base\Controller\SurveyController::teacherView'
  requirements:
    _custom_access: '\Drupal\piv_base\Controller\SurveyController::teacherViewAccess'

piv_base.poet_survey_view:
  path: '/survey/poet/{node}/view'
  defaults:
    _title: 'Poet Survey'
    _controller: '\Drupal\piv_base\Controller\SurveyController::poetView'
  requirements:
    _custom_access: '\Drupal\piv_base\Controller\SurveyController::poetViewAccess'

piv_base.google_search_en:
  path: '/advanced-search'
  defaults:
    _title: 'Search'
    _controller: '\Drupal\piv_base\Controller\GoogleSearchController::build'
    route_language: 'en'
  requirements:
    _permission: 'access content'

piv_base.google_search_fr:
  path: '/recherche-avancee'
  defaults:
    _title: 'Search'
    _controller: '\Drupal\piv_base\Controller\GoogleSearchController::build'
    route_language: 'fr'
  requirements:
    _permission: 'access content'
  
piv_base.school_visit_summary:
  path: '/admin/school-visits-summary'
  defaults:
    _title: 'School Visits Summary'
    _controller: '\Drupal\piv_base\Controller\SchoolVisitsSummaryController::build'
  requirements:
    _permission: 'access administration pages'
