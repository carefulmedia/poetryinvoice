piv_live_competition.yearly_results:
  path: '/recite/team-regionals/{year}'
  defaults:
    _title_callback: '\Drupal\piv_live_competition\Controller\YearlyResultsController::title'
    _controller: '\Drupal\piv_live_competition\Controller\YearlyResultsController'
  requirements:
    _permission: 'access content'
    year: '\d{4}'
  options:
    parameters:
      year:
        type: string

