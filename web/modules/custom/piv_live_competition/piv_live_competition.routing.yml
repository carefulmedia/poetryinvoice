piv_live_competition.score:
  path: '/live-competition-scoring/{node}/{user}'
  defaults:
    _title_callback: '\Drupal\piv_live_competition\Controller\ScoreController::title'
    _controller: '\Drupal\piv_live_competition\Controller\ScoreController'
    node: null
    user: null
  requirements:
    _custom_access: '\Drupal\piv_live_competition\Controller\ScoreController::access'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - competition
      user:
        type: entity:user

piv_live_competition.api_round:
  path: '/api/live-competition-round/{node}'
  defaults:
    _title: 'Team Regional Round'
    _controller: '\Drupal\piv_live_competition\Controller\ScoreController::activeRound'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - competition

piv_live_competition.live_competition_list:
  path: '/user/{user}/live-competitions'
  defaults:
    _title: 'Team Regionals'
    _controller: '\Drupal\piv_live_competition\Controller\LiveCompetitionsListController'
  requirements:
    _custom_access: '\Drupal\piv_live_competition\Controller\LiveCompetitionsListController::access'

piv_live_competition.teacher_live_competition_list:
  path: '/user/{user}/teacher-live-competitions'
  defaults:
    _title: 'Team Regionals'
    _controller: '\Drupal\piv_live_competition\Controller\TeacherLiveCompetitionsListController'
  requirements:
    _custom_access: '\Drupal\piv_live_competition\Controller\TeacherLiveCompetitionsListController::access'
  options:
    parameters:
      user:
        type: entity:user

piv_live_competition.recitations_list:
