uuid: 3c86bec8-5bc7-4b71-b3d1-43695883956c
langcode: en
status: true
dependencies: {  }
id: upgrade_d7_url_alias
class: Drupal\migrate\Plugin\Migration
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'URL aliases'
source:
  plugin: d7_url_alias
  constants:
    slash: /
    node: /node
process:
  id:
    -
      plugin: get
      source: pid
  _path:
    -
      plugin: concat
      source:
        - constants/slash
        - source
  alias:
    -
      plugin: concat
      source:
        - constants/slash
        - alias
  _migrated_nid:
    -
      plugin: explode
      source: source
      delimiter: /
    -
      plugin: extract
      default: INVALID_NID
      index:
        - 1
    -
      plugin: migration_lookup
      migration:
        - upgrade_d7_node_complete_article
        - upgrade_d7_node_complete_blog
        - upgrade_d7_node_complete_bulletin_board
        - upgrade_d7_node_complete_competition_entry
        - upgrade_d7_node_complete_competition_session
        - upgrade_d7_node_complete_competition
        - upgrade_d7_node_complete_event
        - upgrade_d7_node_complete_faq
        - upgrade_d7_node_complete_fca
        - upgrade_d7_node_complete_forum
        - upgrade_d7_node_complete_journal_poem
        - upgrade_d7_node_complete_judge_page
        - upgrade_d7_node_complete_lesson_plan
        - upgrade_d7_node_complete_maptest
        - upgrade_d7_node_complete_media_coverage
        - upgrade_d7_node_complete_mixtape
        - upgrade_d7_node_complete_page
        - upgrade_d7_node_complete_pal_pir_school_visit
        - upgrade_d7_node_complete_panel
        - upgrade_d7_node_complete_poem_rights_contact
        - upgrade_d7_node_complete_poem
        - upgrade_d7_node_complete_poll
        - upgrade_d7_node_complete_power_points
        - upgrade_d7_node_complete_press_release
        - upgrade_d7_node_complete_quote
        - upgrade_d7_node_complete_school_champion
        - upgrade_d7_node_complete_school
        - upgrade_d7_node_complete_slideshow_image
        - upgrade_d7_node_complete_student
        - upgrade_d7_node_complete_team_regionals_entry
        - upgrade_d7_node_complete_test
        - upgrade_d7_node_complete_venue
        - upgrade_d7_node_complete_video
        - upgrade_d7_node_complete_writing_prompt
        - upgrade_d7_node_complete_writing_workshop
    -
      plugin: node_complete_node_lookup
  node_translation:
    -
      plugin: explode
      source: source
      delimiter: /
    -
      plugin: extract
      default: INVALID_NID
      index:
        - 1
    -
      plugin: migration_lookup
      migration: {  }
    -
      plugin: node_complete_node_translation_lookup
  langcode:
    -
      plugin: null_coalesce
      source:
        - '@node_translation/1'
        - language
  path:
    -
      plugin: path_set_translated
      source:
        - '@_path'
        - '@node_translation'
    -
      plugin: transform_alias_if_node
      source: source
      migrated_nid: '@_migrated_nid'
destination:
  plugin: 'entity:path_alias'
migration_dependencies:
  required: {  }
  optional: {  }
