uuid: bf701bd4-eb87-4d3d-8e63-fc2e83b29b1d
langcode: en
status: true
dependencies: {  }
id: upgrade_d7_node_complete_competition
class: Drupal\node\Plugin\migrate\D7NodeTranslation
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'Node complete (Competition)'
source:
  plugin: d7_node_complete
  node_type: competition
process:
  nid:
    -
      plugin: get
      source: tnid
  vid:
    -
      plugin: get
      source: vid
  langcode:
    -
      plugin: default_value
      source: language
      default_value: und
  title:
    -
      plugin: get
      source: title
  uid:
    -
      plugin: get
      source: node_uid
  status:
    -
      plugin: get
      source: status
  created:
    -
      plugin: get
      source: created
  changed:
    -
      plugin: get
      source: timestamp
  promote:
    -
      plugin: get
      source: promote
  sticky:
    -
      plugin: get
      source: sticky
  revision_uid:
    -
      plugin: get
      source: revision_uid
  revision_log:
    -
      plugin: get
      source: log
  revision_timestamp:
    -
      plugin: get
      source: timestamp
  content_translation_source:
    -
      plugin: get
      source: source_langcode
  comment_node_competition/0/status:
    -
      plugin: get
      source: comment
  body:
    -
      plugin: get
      source: body
  field_competition_school:
    -
      plugin: sub_process
      source: field_competition_school
      process:
        target_id: nid
  field_judges:
    -
      plugin: sub_process
      source: field_judges
      process:
        target_id:
          -
            plugin: paragraphs_lookup
            tags: 'Field Collection Content'
            source: value
          -
            plugin: extract
            index:
              - id
        target_revision_id:
          -
            plugin: paragraphs_lookup
            tags:
              - 'Field Collection Revisions Content'
              - 'Field Collection Content'
            tag_ids:
              'Field Collection Revisions Content':
                - revision_id
              'Field Collection Content':
                - value
          -
            plugin: extract
            index:
              - revision_id
  field_years_in_competition:
    -
      plugin: get
      source: field_years_in_competition
  field_level:
    -
      plugin: get
      source: field_level
  field_language_stream:
    -
      plugin: get
      source: field_language_stream
  field_submission_deadline:
    -
      plugin: sub_process
      source: field_submission_deadline
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d H:i:s'
          to_format: 'Y-m-d\TH:i:s'
          source: value
  field_winners_announced:
    -
      plugin: sub_process
      source: field_winners_announced
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d H:i:s'
          to_format: 'Y-m-d\TH:i:s'
          source: value
  field_host_teacher:
    -
      plugin: sub_process
      source: field_host_teacher
      process:
        target_id:
          plugin: migration_lookup
          migration: upgrade_d7_user
          source: uid
destination:
  plugin: 'entity_complete:node'
  translations: true
  default_bundle: competition
migration_dependencies:
  required:
    - upgrade_d7_user
    - upgrade_d7_node_type
    - upgrade_language
    - upgrade_d7_field_collection_judges
    - upgrade_d7_field_collection_revisions_judges
  optional:
    - upgrade_d7_field_instance
    - upgrade_d7_comment_field_instance
    - upgrade_d7_user
