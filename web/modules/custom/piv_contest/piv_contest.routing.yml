piv_contest.add_score:
  path: '/judge/{recitation}/{judging_session}'
  defaults:
    _title: 'Create Score'
    _form: 'Drupal\piv_contest\Form\ScoreForm'
  requirements:
    _permission: 'access content'

system.admin_contest:
  path: '/admin/contest'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    link_id: 'system.admin_contest'
    _title: 'Contest'
  requirements:
    _permission: 'administer site configuration'

system.admin_contest_config:
  path: '/admin/contest/config'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    link_id: 'system.admin_contest_config'
    _title: 'Configure'
  requirements:
    _permission: 'administer site configuration'

piv_content.competitions_list:
  path: '/user/{user}/competitions'
  defaults:
    _title: 'Competitions'
    _controller: '\Drupal\piv_contest\Controller\CompetitionsListController::build'
  requirements:
    _custom_access: '\Drupal\piv_contest\Controller\CompetitionsListController::access'

# Redirects.
piv_contest.online_semifinals_redirect:
  path: '/user/online-semifinals/entries'
  defaults:
    _title: 'Online semifinals'
    _controller: '\Drupal\piv_contest\Controller\CompetitionsListController::onlineSemifinalsRedirect'
  requirements:
    _permission: 'access content'

piv_contest.recite_submit_redirect:
  path: '/recite/submit'
  defaults:
    _title: 'Online semifinals'
    _controller: '\Drupal\piv_contest\Controller\CompetitionsListController::onlineSemifinalsRedirect'
  requirements:
    _permission: 'access content'

piv_contest.reciter_soumettre_redirect:
  path: '/reciter/soumettre'
  defaults:
    _title: 'Online semifinals'
    _controller: '\Drupal\piv_contest\Controller\CompetitionsListController::onlineSemifinalsRedirect'
  requirements:
    _permission: 'access content'

piv_contest.competition:
  path: '/user/{user}/competitions/{competition}'
  defaults:
    _title_callback: '\Drupal\piv_contest\Controller\CompetitionController::title'
    _controller: '\Drupal\piv_contest\Controller\CompetitionController::build'
  requirements:
    _custom_access: '\Drupal\piv_contest\Controller\CompetitionController::access'

piv_contest.competition_entry_add:
  path: '/user/{user}/competitions/{competition}/{stream}/competition-entry/add'
  defaults:
    _title: 'Add competition entry'
    _controller: '\Drupal\piv_contest\Controller\CompetitionEntryController::add'
  requirements:
    _custom_access: '\Drupal\piv_contest\Controller\CompetitionEntryController::accessAdd'
  options:
    parameters:
      stream:
        type: entity:paragraph

piv_contest.competition_entry_edit:
  path: '/user/{user}/competitions/{competition}/competition-entry/{competition_entry}/edit'
  defaults:
    _title: 'Edit competition entry'
    _controller: '\Drupal\piv_contest\Controller\CompetitionEntryController::edit'
  requirements:
    _custom_access: '\Drupal\piv_contest\Controller\CompetitionEntryController::accessEdit'

entity.competition.delete_multiple_form:
  path: '/admin/content/competition/delete'
  defaults:
    _form: '\Drupal\Core\Entity\Form\DeleteMultipleForm'
    entity_type_id: 'competition'
  requirements:
    _entity_delete_multiple_access: 'competition'

entity.competition_entry.delete_multiple_form:
  path: '/admin/content/competition-entry/delete'
  defaults:
    _form: '\Drupal\Core\Entity\Form\DeleteMultipleForm'
    entity_type_id: 'competition_entry'
  requirements:
    _entity_delete_multiple_access: 'competition_entry'

entity.judging_session.delete_multiple_form:
  path: '/admin/content/judging-session/delete'
  defaults:
    _form: '\Drupal\Core\Entity\Form\DeleteMultipleForm'
    entity_type_id: 'judging_session'
  requirements:
    _entity_delete_multiple_access: 'judging_session'

entity.recitation.delete_multiple_form:
  path: '/admin/content/recitation/delete'
  defaults:
    _form: '\Drupal\Core\Entity\Form\DeleteMultipleForm'
    entity_type_id: 'recitation'
  requirements:
    _entity_delete_multiple_access: 'recitation'

entity.score_template.delete_multiple_form:
  path: '/admin/content/score-template/delete'
  defaults:
    _form: '\Drupal\Core\Entity\Form\DeleteMultipleForm'
    entity_type_id: 'score_template'
  requirements:
    _entity_delete_multiple_access: 'score_template'

entity.score.delete_multiple_form:
  path: '/admin/content/score/delete'
  defaults:
    _form: '\Drupal\Core\Entity\Form\DeleteMultipleForm'
    entity_type_id: 'score'
  requirements:
    _entity_delete_multiple_access: 'score'
