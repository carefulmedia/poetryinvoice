services:
  plugin.manager.score_form:
    class: Drupal\piv_contest\ScoreFormPluginManager
    parent: default_plugin_manager

  piv_contest.score_form_builder:
    class: Drupal\piv_contest\ScoreFormBuilder
    arguments: ['@plugin.manager.score_form', '@entity_type.manager', '@current_user', '@language_manager']
  Drupal\piv_contest\ScoreFormBuilder: '@piv_contest.score_form_builder'

  piv_contest.competition_service:
    class: Drupal\piv_contest\CompetitionService
    arguments:
      - '@entity_type.manager'

  piv_contest.competition_rank_helper:
    class: Drupal\piv_contest\CompetitionRankHelper
    arguments:
      - '@entity_type.manager'

  piv_contest.competition_enrollment:
    class: Drupal\piv_contest\CompetitionEnrollment
    arguments:
      - '@entity_type.manager'
      - '@piv_contest_competition_entry.competition_lock_service'
      - '@language_manager'

  piv_contest.notification_logs:
    class: Drupal\piv_contest\NotificationLogs
    arguments: ['@entity_type.manager']
