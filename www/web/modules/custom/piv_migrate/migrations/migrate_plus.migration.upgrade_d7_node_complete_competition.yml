          plugin: format_date
          from_format: 'Y-m-d H:i:s'
          to_format: 'Y-m-d\TH:i:s'
          source: value
  field_winners_announced:
    -
      plugin: sub_process
      source: field_winners_announced
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d H:i:s'
          to_format: 'Y-m-d\TH:i:s'
          source: value
  field_host_teacher:
    -
      plugin: sub_process
      source: field_host_teacher
      process:
        target_id:
