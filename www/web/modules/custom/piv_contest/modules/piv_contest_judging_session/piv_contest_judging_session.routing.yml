piv_contest_judging_session.manage_sessions:
  path: '/competition/{competition}/manage-sessions'
  defaults:
    _title: 'Manage Sessions'
    _form: '\Drupal\piv_contest_judging_session\Form\ManageSessionsForm'
  requirements:
    _permission: 'create judging session'

piv_contest_judging_session.add_session:
  path: '/competition/{competition}/add-session'
  defaults:
    _title: 'Create Session'
    _controller: '\Drupal\piv_contest_judging_session\Controller\JudgingSessionController::add'
  requirements:
    _permission: 'access content'

piv_contest_judging_session.start_judging:
  path: '/user/{user}/start-judging'
  defaults:
    _title: 'Start judging'
    _controller: '\Drupal\piv_contest_judging_session\Controller\JudgingSessionController::startJudging'
  requirements:
    _custom_access: '\Drupal\piv_contest_judging_session\Controller\JudgingSessionController::accessStartJudging'

piv_contest_judging_session.judge_recitations:
  path: '/user/{user}/judge/{judging_session}'
  defaults:
    _title: 'Judge now'
    _controller: '\Drupal\piv_contest_judging_session\Controller\JudgingSessionController::judgeSession'
  requirements:
    _custom_access: '\Drupal\piv_contest_judging_session\Controller\JudgingSessionController::accessJudgeSession'

piv_contest_judging_session.judge_for_accuracy:
  path: '/user/{user}/judge-for-accuracy'
  defaults:
    _title: 'Judge for accuracy'
    _controller: '\Drupal\piv_contest_judging_session\Controller\AccuracyJudgingSessionController::sessionsList'
  requirements:
    _custom_access: '\Drupal\piv_contest_judging_session\Controller\AccuracyJudgingSessionController::accessSessionsList'

piv_contest_judging_session.judge_for_accuracy.recitations_list:
  path: '/user/{user}/judge-for-accuracy/{judging_session}'
  defaults:
    _title: 'Judge for accuracy'
    _controller: '\Drupal\piv_contest_judging_session\Controller\AccuracyJudgingSessionController::recitationsList'
  requirements:
    _custom_access: '\Drupal\piv_contest_judging_session\Controller\AccuracyJudgingSessionController::accessRecitationsList'

piv_contest_judging_session.judge_for_accuracy.judge_competition_entry:
  path: '/user/{user}/judge-for-accuracy/{judging_session}/{competition_entry}'
  defaults:
    _title: 'Judging competition entry'
    _controller: '\Drupal\piv_contest_judging_session\Controller\AccuracyJudgingSessionController::judgeCompetitionEntry'
  requirements:
    _custom_access: '\Drupal\piv_contest_judging_session\Controller\AccuracyJudgingSessionController::accessJudgeCompetitionEntry'
