  subject: 'La visite d’un ou d’une poète a été demandée : [school_name]'
  body:
    value: "<p>Bonjour,</p>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">Merci de participer au programme Poètes à l’école des Voix de la poésie !</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">\r\n<div>&nbsp;</div>\r\n\r\n<div>Ce message automatique est envoyé à tous les enseignant·es de [school_name] qui ont&nbsp;<span class=\"il\">un</span>&nbsp;compte sur notre site pour vous permettre de travailler avec [booking_teacher] qui a demandé&nbsp;<span class=\"il\">une</span>&nbsp;<span class=\"il\">visite</span>&nbsp;de&nbsp;<span class=\"il\">poète</span>.</div>\r\n\r\n<div>Notre programme couvre les frais d’une visite en personne d’un maximum de trois heures passées dans l’école, ou encore de deux visites virtuelles d’une heure.&nbsp;</div>\r\n\r\n<div>&nbsp;</div>\r\n\r\n<div>[booking_teacher],&nbsp;<span class=\"il\">une</span>&nbsp;membre de notre équipe vous contactera dans les prochains jours pour organiser cette&nbsp;<span class=\"il\">visite</span>.&nbsp;</div>\r\n\r\n<div>&nbsp;</div>\r\n\r\n<div>&nbsp;</div>\r\n\r\n<div>Cordialement,</div>\r\n\r\n<div>&nbsp;</div>\r\n\r\n<div>L’équipe des Voix de la poésie</div>\r\n</div>\r\n\r\n<p><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">PS : Pensez à <a href=\"http://poetryinvoice.com/sites/default/files/LVP-Flyer.pdf\">imprimer ce dépliant</a> et à l'accrocher dans vos salles de classe et dans les couloirs pour aider à promouvoir notre prix mensuel de poésie. Vos élèves pourraient gagner 100 $ et être publié·e·s dans notre journal de poésie, VOICES/VOIX !</span></p>\r\n"
    format: full_html
