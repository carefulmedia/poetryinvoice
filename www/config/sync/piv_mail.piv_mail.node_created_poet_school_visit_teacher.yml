  subject: 'A poet visit has been requested for [school_name]'
  body:
    value: "<p><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">Dear teachers</span><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">,</span></p>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">We are delighted that&nbsp;[school_name] has made a request for a visit through our Poet In Your Class program.&nbsp;</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">This email is being sent to the teacher at your school who has requested a poet visit, [booking_teacher], and to all other teachers with accounts on our site. Our program covers the cost of one 3-hour in-person visit or two 1-hour virtual visits per school, so we invite you to coordinate with your colleague(s) to ensure the greatest number of students can benefit from this visit.</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">A member of our team will contact [booking_teacher] shortly to organize your poet visit.</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">In the meantime, please consider <a href=\"https://poetryinvoice.com/sites/default/files/PIV-Flyer.pdf\">printing this flyer</a> and hanging it in your classrooms and hallways to help promote our monthly poetry prize. Your students could win $100 and publication in our poetry journal VOICES/VOIX!</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">Sincerely yours,</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;</div>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">The Poetry In Voice Team</div>\r\n"
    format: full_html
