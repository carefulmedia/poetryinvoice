  subject: 'Merci pour votre soumission au journal de poésie VOIX'
  body:
    value: "<p>Bonjour [first_name],</p>\r\n\r\n<p>Merci d’avoir soumis un texte à notre journal de poésie, <em>VOIX </em>! Vous saurez si votre texte sera publié avant le 5 juin.</p>\r\n\r\n<p>La parution du journal sera accessible sur notre site en juin. Nous espérons que vous irez la lire !</p>\r\n\r\n<p>Merci encore,<br />\r\nL'équipe des Voix de la poésie</p>\r\n"
    format: full_html
