  subject: 'Thank you for submitting to VOICES'
  body:
    value: "<p>Dear [first_name],</p>\r\n\r\n<p>Thank you for your submission. We are thrilled to see your interest in our new poetry journal, VOICES.</p>\r\n\r\n<p>You’ll be notified in May whether your work will be published. The issue will appear on our website in June. We hope you’ll check it out.</p>\r\n\r\n<p>Best,<br />\r\nThe Poetry In Voice Team</p>\r\n"
    format: full_html
