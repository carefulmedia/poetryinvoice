  subject: 'Visite de poète prochainement : [school_name]'
  body:
    value: "<p>Bonjour [booking_teacher] et [poet_name],</p>\r\n\r\n<p>Nous souhaitons vous rappeler qu’une visite est prévue :<br />\r\n[school_name]<br />\r\n[school_full_address]</p>\r\n\r\n<p><strong>[visit_datetime]</strong></p>\r\n\r\n<p>Si ce n’est pas déjà fait, n’oubliez pas de communiquer l’un·e avec l’autre afin de clarifier tous les détails listés dans la page pour enseignant·es :&nbsp;<a href=\"https://www.lesvoixdelapoesie.com/poemes/poete/poetes-ecole/preparer-visite\">Préparer une visite</a>.</p>\r\n\r\n<p>N’hésitez pas à partager des photos sur les réseaux sociaux et à y identifier Les voix de la poésie !<br />\r\n@PIVLVP sur Facebook, Twitter et Instagram</p>\r\n\r\n<p>Si vous ne l’avez pas déjà fait, nous vous encourageons à regarder <a href=\"https://www.lesvoixdelapoesie.com/bienvenue\">notre courte vidéo de présentation</a> avec vos élèves.</p>\r\n\r\n<p><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">Pensez&nbsp;</span><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">également</span><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;à&nbsp;</span><a href=\"http://poetryinvoice.com/sites/default/files/LVP-Flyer.pdf\" style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">imprimer ce dépliant</a><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;et à l'accrocher dans vos salles de classe et dans les couloirs pour aider à promouvoir notre prix mensuel de poésie. Vos élèves pourraient gagner 100 $ et être publié·e·s dans notre journal de poésie, VOICES/VOIX !</span></p>\r\n\r\n<p>Cordialement,<br />\r\nL'équipe des Voix de la poésie</p>\r\n"
    format: full_html
