  subject: 'Your poet visit has been confirmed'
  body:
    value: "<p>Dear [booking_teacher] and [poet_name],</p>\r\n\r\n<p>This is to let you know that a poet visit at [school_name] has been confirmed:</p>\r\n\r\n<p>Visiting poet:&nbsp;<a href=\"[link_to_poet_page_href]\">[poet_name]</a></p>\r\n\r\n<p>Date and time: [visit_datetime] (school's time zone)</p>\r\n\r\n<p>School:<br />\r\n[school_name]<br />\r\n[school_full_address]</p>\r\n\r\n<p>Visit type: [visit_type]</p>\r\n\r\n<p>Pre-visit notes for poet:<br />\r\n[visit_notes]</p>\r\n\r\n<p>Please be sure to communicate by phone or email to discuss how to prepare for the visit as outlined on our website (both your email addressess are in the header of this message):<br />\r\n<a href=\"https://www.poetryinvoice.com/poems/poet/poet-class/prepare-visit\">https://www.poetryinvoice.com/poems/poet/poet-class/prepare-visit</a></p>\r\n\r\n<p>You can view your visit details here:<br />\r\n<a href=\"https://www.poetryinvoice.com/node/[nid]\">https://www.poetryinvoice.com/node/[nid]</a></p>\r\n\r\n<p>[booking_teacher], you can update the “Pre-visit notes for poets” at any time. You will both receive an automatic reminder one week, and then one day before your visit. Enjoy your day together and if you have any questions along the way, do not hesitate to contact me.</p>\r\n\r\n<p>Poetry In Voice asks all teachers to screen our <a href=\"https://www.poetryinvoice.com/welcome\">short introductory video</a> for students prior to a poet’s arrival. The video puts an exciting, contemporary spin on poetry and previews all of the great resources we have for students on our site.</p>\r\n\r\n<p><a href=\"https://www.poetryinvoice.com/welcome\"><img alt=\"\" data-entity-type=\"\" data-entity-uuid=\"\" src=\"http://poetryinvoice.lndo.site/sites/default/files/sites/all/themes/omega_pivlvp/images/still-frame-grey-icon.jpg\" style=\"width: 600px; height: 338px;\" /></a></p>\r\n\r\n<p>Yours sincerely,<br />\r\n[visit_admin]</p>\r\n"
    format: full_html
fr:
  active: 1
  to:
    poet: poet
    teacher_that_created_the_visit: teacher_that_created_the_visit
