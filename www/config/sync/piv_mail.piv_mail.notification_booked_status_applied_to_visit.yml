    all_teachers_at_the_school: 0
  to_more: ''
  subject: 'Confirmation de votre visite'
  body:
    value: "<p>Bonjour [booking_teacher] et [poet_name],</p>\r\n\r\n<p>Nous confirmons la tenue d’une visite de poète à [school_name]&nbsp;:</p>\r\n\r\n<p><strong>Poète</strong>&nbsp;:<br />\r\n<a href=\"[link_to_poet_page_href]\">[poet_name]</a></p>\r\n\r\n<p><strong>Date et heure prévues de la visite&nbsp;:</strong><br />\r\n[visit_datetime] (selon le fuseau horaire où se trouve l’école)</p>\r\n\r\n<p><strong>École&nbsp;:</strong><br />\r\n[school_name]<br />\r\n[school_full_address]</p>\r\n\r\n<p><strong>Visite en personne ou visioconférence?</strong> [visit_type]</p>\r\n\r\n<p><strong>Informations pour le ou la poète&nbsp;:</strong><br />\r\n[visit_notes]</p>\r\n\r\n<p>&nbsp;</p>\r\n\r\n<p><strong>Pour la suite :&nbsp;</strong></p>\r\n\r\n<p>Nous vous encourageons à communiquer l’un·e avec l’autre pour aborder les détails de la visite. (Vos adresses courriel se trouvent dans l'entête de ce message.) Les points que nous vous suggérons d’aborder sont listés sur la page pour enseignant·es&nbsp;<a href=\"https://www.lesvoixdelapoesie.com/poemes/poete/poetes-ecole/preparer-visite\">Préparer la visite</a>.</p>\r\n\r\n<p>Un <a href=\"https://www.lesvoixdelapoesie.com/propos/reseau-poetes/preparer-visite\">canevas de visite</a> est aussi disponible sur notre site.&nbsp;</p>\r\n\r\n<p>&nbsp;</p>\r\n\r\n<p><strong>Les détails de la visite peuvent être consultés ici</strong> :<br />\r\n<a href=\"https://www.lesvoixdelapoesie.com/node/[nid]\">https://www.lesvoixdelapoesie.com/node/[nid]</a>.</p>\r\n\r\n<p><strong>Vous recevrez un rappel automatique une semaine et un jour avant la visite. </strong>Enfin, nous demandons que toutes les classes voient <a href=\"http://www.lesvoixdelapoesie.com/bienvenue\">la courte vidéo des Voix de la poésie</a> avant que les poètes rencontrent les élèves. Cette vidéo permettra d’aborder la poésie sous un angle contemporain et d’envisager la participation à nos différentes activités.</p>\r\n\r\n<p>N’hésitez pas à nous écrire pour toute question et nous vous souhaitons un excellent atelier et avons hâte d’avoir de vos nouvelles !</p>\r\n\r\n<p>L’équipe des Voix de la poésie</p>\r\n"
    format: full_html
