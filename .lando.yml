name: piv9
recipe: drupal9
config:
  php: '8.1'
  webroot: web
  xdebug: true

proxy:
  appserver:
    - piv9.lndo.site
    - lesvoixdelapoesie.lndo.site
  solr:
    - solr.piv9.lndo.site:8983
services:
  appserver:
    build_as_root:
      - apt update && apt install zlib1g-dev
      - 'mkdir -p /usr/src/php/ext && cd /usr/src/php/ext && git clone https://github.com/NoiseByNorthwest/php-spx.git spx && cd spx/ && git checkout release/latest'
      - 'cd /usr/src/php/ext/spx && phpize && ./configure'
      - docker-php-ext-install spx
      - echo 'spx.http_enabled=1' >> /usr/local/etc/php/conf.d/docker-php-ext-spx.ini
      - echo 'spx.http_key="dev"' >> /usr/local/etc/php/conf.d/docker-php-ext-spx.ini
      - echo 'spx.http_ip_whitelist="*"' >> /usr/local/etc/php/conf.d/docker-php-ext-spx.ini
  pma:
    type: phpmyadmin
  # The Drupal 7 database to use as migrate source.
  d7db:
    type: mariadb
    creds:
      user: drupal7db
      password: drupal7db
      database: drupal7db
    portforward: true
  node:
    type: node
    build:
      - cd /app/web/themes/custom/piv && npm install
      - cd /app/web/themes/custom/lvp_barrio && npm install
    globals:
      gulp-cli: latest
  mailhog:
    type: mailhog
    hogfrom:
      - appserver
  phpmyadmin:
    type: phpmyadmin
  solr:
    type: solr:8.11
    portforward: true
    config:
      dir: config/solr-config-set

tooling:
  drush:
    cmd: /app/vendor/drush/drush/drush --root=/app/web
    env:
      DRUSH_OPTIONS_URI: "http://piv9.lndo.site"
  npm:
    service: node
  node:
    service: node
  gulp:
    service: node
  phpcs:
    service: appserver
    cmd: /app/vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme,css,info,txt,yml
    description: Run phpcs for given folder or file.
  phpcbf:
    service: appserver
    cmd: /app/vendor/bin/phpcbf --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme,css,info,txt,yml
    description: Run phpcbf for given folder or file.
