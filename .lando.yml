name: piv9
recipe: drupal9
config:
  webroot: www/web
  xdebug: true

services:
  pma:
    type: phpmyadmin
  # The Drupal 7 database to use as migrate source.
  d7db:
    type: mariadb
    creds:
      user: drupal7db
      password: drupal7db
      database: drupal7db
    portforward: true
  node:
    type: node
    build:
      - cd /app/www/web/themes/custom/piv && npm install
    globals:
      gulp-cli: latest

tooling:
  drush:
    cmd: /app/www/vendor/drush/drush/drush --root=/app/www/web
    env:
      DRUSH_OPTIONS_URI: "http://piv9.lndo.site"
  npm:
    service: node
  node:
    service: node
  gulp:
    service: node
  phpcs:
    service: appserver
    cmd: /app/www/vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme,css,info,txt,md,yml
    description: Run phpcs for given folder or file.
