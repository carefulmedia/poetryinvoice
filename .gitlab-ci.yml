stages:
  - deploy

# Push the same branch to Pantheon Git (requires CI variables PANTHEON_GIT_SSH_URL, PANTHEON_SSH_PRIVATE_KEY).
# Uses the shared docker image runner — not the tagged dev server below.
push_pantheon:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH && $PANTHEON_GIT_SSH_URL && $PANTHEON_SSH_PRIVATE_KEY
  before_script:
    - apk add --no-cache bash git openssh-client
  script:
    - chmod +x .ci/pantheon-push.sh
    - export PANTHEON_GIT_SSH_URL="$PANTHEON_GIT_SSH_URL"
    - export PANTHEON_SSH_PRIVATE_KEY="$PANTHEON_SSH_PRIVATE_KEY"
    - .ci/pantheon-push.sh "$CI_COMMIT_BRANCH"

deploy:
 stage: deploy
 tags:
   - dev
 script:
   - cd /var/www/dev.poetryinvoice.com
   - pwd
   - git checkout dev
   - git pull origin dev
   - cd /var/www/dev.poetryinvoice.com/www
   - /usr/bin/composer install
   - /var/www/dev.poetryinvoice.com/www/vendor/drush/drush/drush -y cache-rebuild
   - /var/www/dev.poetryinvoice.com/www/vendor/drush/drush/drush -y updatedb
   - /var/www/dev.poetryinvoice.com/www/vendor/drush/drush/drush -y config-import
 only:
   - dev
