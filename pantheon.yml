# Put overrides to your pantheon.upstream.yml file here.
# For more information, see: https://pantheon.io/docs/pantheon-yml/
api_version: 1
workflows:
  sync_code:
    after:
      - type: webphp
        description: Rebuild Drupal caches
        script: private/scripts/drush-cache-rebuild.php
      - type: webphp
        description: Regenerate Poem Roulette JSON caches
        script: private/scripts/roulette/generate-cache.php
  deploy:
    after:
      - type: webphp
        description: Rebuild Drupal caches
        script: private/scripts/drush-cache-rebuild.php
      - type: webphp
        description: Regenerate Poem Roulette JSON caches
        script: private/scripts/roulette/generate-cache.php
