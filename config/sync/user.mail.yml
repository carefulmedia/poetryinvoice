password_reset:
  subject: 'A new password for [user:piv_teacher_first_name]'
  body: "Dear [user:piv_teacher_first_name],\r\n\r\nThank you for your request to reset the password to your account.\r\n\r\nYou may now log in by clicking this link or copying and pasting it to your\r\nbrowser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThe link above can only be used once. It will lead you to a page where you can set a new password. The link expires after one day.\r\n\r\nThank you, \r\n[site:name]\r\n\r\n"
register_admin_created:
  subject: 'FR You may begin judging the Online Qualifiers'
  body: "Dear [user:piv_teacher_first_name],\r\n\r\nWelcome to your account on the Poetry In Voice website. To log in please click on this link:\r\n[user:one-time-login-url]\r\n \r\nThe 2021 Poetry In Voice/Les voix de la poésie Senior Online Qualifiers judging period is now open.\r\n\r\nSETTING UP YOUR ACCOUNT\r\n\r\nYour judge’s account has been activated. Please follow this link to log in:\r\nLink TK\r\n\r\nPlease set your password after you log in if you haven't in the past.\r\n \r\nACCESSING YOUR ACCOUNT\r\n\r\nIn the future, you can log in by going to the Poetry In Voice homepage and clicking “Log in” in the upper right corner of your screen or by following this link:\r\nhttp://www.poetryinvoice.com/user\r\n\r\nForgot your password? You can retrieve it here:\r\nhttp://www.poetryinvoice.com/user/password\r\n\r\n \r\n\r\nJUDGING RECITATIONS\r\n\r\nAfter you log in, you can start judging by clicking on “Start judging,” also at the top of the screen. Take a few minutes to read the “How to judge the Online Contest” page before you begin.\r\n\r\nClick “Judge now” to begin a session.\r\n\r\nYou can leave a session at any time by clicking “Judge later” at the bottom of the screen. When you return, the system will take you back to where you stopped.\r\n\r\n \r\n\r\nDEADLINES\r\n\r\nThere are two judging periods this year. Please be sure to complete your work by our deadlines:\r\n\r\n1st period: March 5th –  March 9th  @ 5pm (Pacific)\r\n\r\n2nd period: March 11th – March 17th @ 5pm (Pacific)\r\n\r\nYou may see student recitations that you judged in the 1st period again in the 2nd period; we ask you to judge these recitations afresh.\r\n\r\n \r\n\r\nTROUBLESHOOTING\r\n\r\nIf you are unable to complete a session or if you have any questions, please email or call David Smith at david@poetryinvoice.com, 514-668-0768 as soon as possible.\r\n\r\n \r\n\r\nThank you for joining us in encouraging students to learn poetry by heart.\r\n\r\nAll best,\r\n\r\nThe Poetry In Voice/Les voix de la poésie team***************************"
register_no_approval_required:
  subject: 'Welcome to Poetry In Voice!'
  body: "<p>Dear [user:piv_teacher_first_name],</p>\r\n<p>\r\n\tWelcome to Poetry In Voice! We are a charitable organization that that encourages Canadian students to fall in love with poetry through reading, recitation, and writing.</p>\r\n<p>\r\n\tThanks so much for creating an account with us. Your account has been activated.</p>\r\n<p>\r\n\tTo log in, click the link below or copy and paste it into your browser (this link will only work once):<br>\r\n[user:one-time-login-url]</p>\r\n<p>\r\n\tOnce you&rsquo;re logged in, you&rsquo;ll be able to access all of our free resources:</p>\r\n<ul>\r\n\t<li>\r\n\t\t<a href=\"https://poetryinvoice.ca/teach/poet-class\">Request a poet visit for your school</a></li>\r\n\t<li>\r\n\t\t<a href=\"https://poetryinvoice.ca/teach/lesson-plans\">Access our library of poetry lesson plans</a></li>\r\n\t<li>\r\n\t\t<a href=\"https://poetryinvoice.ca/recite/school-contests/run-contest\">Run a recitation contest </a>using <a href=\"https://www.poetryinvoice.ca/read\">our anthology</a></li>\r\n\t<li>\r\n\t\t<a href=\"https://poetryinvoice.ca/write\">Use our creative writing activities</a></li>\r\n</ul>\r\n<p>\r\n\tIf you have any questions, feel free to get in touch with our team:<br />\r\n\t<a href=\"mailto:info@poetryinvoice.ca\">info@poetryinvoice.ca</a>.</p>\r\n<p>\r\n\tWe look forward to working with you!</p>\r\n<p>\r\n\tThe Poetry In Voice team</p>\r\n<p>\r\n\t&nbsp;</p>\r\n\r\n"
register_pending_approval:
