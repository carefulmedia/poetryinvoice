status_activated:
  subject: 'Your Poet Network account has been activated'
  body: "<p>\r\n\tHello [user:piv_teacher_first_name],</p><p>\r\n    Thank you for sending us your application. We are pleased to have you join our Poet Network.</p>\r\n<p>Your account has been activated. To log in, click the link below or copy and paste it into your browser (this link will only work once):<br>\r\n[user:one-time-login-url]\r\n<p> When you log in and visit the <a href=\"https://poetryinvoice.ca/about/poet-network\">Poet Network page</a>, you will have access to even more information about each job opportunity.</p>\r\n\r\n<p>\r\n    The next step is to log in to your account and complete <em>all of the fields</em>, including the micro-interview. Once this work is done, you will receive an e-transfer of $50 and you will be ready to start working with us.</p>\r\n<p>\r\n    &nbsp;</p>\r\n<p>\r\n    You do not need to complete your profile all at once, but remember to hit save before logging out. Please ensure your personal biography is 100-150 words and addresses all of the points outlined in our <a href=\"https://poetryinvoice.ca/about/poet-network/writing-guidelines\">writing guidelines</a> for &ldquo;Short Biography of Another Poet.&rdquo;</p>\r\n<p>\r\n    You may wish to have a look at poet profiles published on our website such as <a href=\"https://www.poetryinvoice.ca/read/poets/adam-sol\"> Adam Sol's</a> and <a href=\"https://www.poetryinvoice.ca/read/poets/linda-besner\"> Linda Bresner's</a> as examples.\r\n</p>\r\n    When you have completed your profile, please check the box at the bottom of the page indicating that you have completed your profile and that it is ready for review. We will get in touch if we have any questions or concerns.</p>\r\n\r\n<p>\r\n    If you have any difficulties along the way, do not hesitate to contact me.</p>\r\n<p>\r\n    &nbsp;</p>\r\n<p>\r\n    All the best,</p>\r\n\r\n<p>\r\n    Caprice\r\n</p>\r\n<p>\r\n    &nbsp;\r\n</p>\r\n<p>\r\n    &nbsp;\r\n</p>\r\n<div>\r\n    Caprice Strgar (she/her/elle)<br>Program Coordinator/ Coordonnatrice des Programmes\r\n</div>\r\n<div>\r\n    <a href=\"mailto:caprice@poetryinvoice.ca\">caprice@poetryinvoice.ca</a>\r\n</div>\r\n<div>\r\n    &nbsp;\r\n</div>\r\n<div>\r\n    <img class=\"CToWUd\" src=\"https://ci3.googleusercontent.com/meips/ADKq_NYb5pVaDgrBcOLlyDJk8eFkL6R_wjVVhHUjSnjCopedrMs4YeO-_VBY1v8_H9onKeAs-SFGu-U6TnOlOT_bHSd04fUFI3wgzqPYQi2geZG8jtlNSao8lh5eqKrwuXTZ00VscvHf=s0-d-e1-ft#https://piv-prod.s3.ca-central-1.amazonaws.com/public/inline-images/PIV-LVP.png\" width=\"200\" height=\"42\">\r\n</div>\r\n"
