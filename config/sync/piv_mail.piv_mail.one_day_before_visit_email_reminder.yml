  subject: 'Visite de poète demain : [school_name]'
  body:
    value: "<p>Bonjour [booking_teacher], [poet_name],</p>\r\n\r\n<p>Ce message vise à vous rappeler qu’une visite est prévue demain :<br />\r\n[school_name]<br />\r\n[school_full_address]</p>\r\n\r\n<p><strong>[visit_datetime]</strong></p>\r\n\r\n<p>N’hésitez pas à partager des photos sur les réseaux sociaux et à y identifier Les voix de la poésie !<br />\r\n@PIVLVP sur Facebook, Twitter et Instagram</p>\r\n\r\n<p>Si vous ne l’avez pas déjà fait, nous vous encourageons fortement à regarder <a href=\"https://www.lesvoixdelapoesie.com/bienvenue\">notre courte vidéo de présentation</a> avec vos élèves.</p>\r\n\r\n<p><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">Pensez&nbsp;</span><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">également</span><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;à&nbsp;</span><a href=\"http://poetryinvoice.com/sites/default/files/LVP-Flyer.pdf\" style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">imprimer ce dépliant</a><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;et à l'accrocher dans vos salles de classe et dans les couloirs pour aider à promouvoir notre prix mensuel de poésie. Vos élèves pourraient gagner 100 $ et être publié·e·s dans notre journal de poésie, VOICES/VOIX !</span></p>\r\n\r\n<p>En vous souhaitant une belle journée poétique demain,</p>\r\n\r\n<div style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">L’équipe des Voix de la poésie</div>\r\n\r\n<div>&nbsp;</div>\r\n"
    format: full_html
