  subject: 'Poet visit to [school_name] tomorrow'
  body:
    value: "<p>Dear [booking_teacher], [poet_name],</p>\r\n\r\n<p>This is a reminder that you have a poet visit scheduled for tomorrow:<br />\r\n[school_name]:<br />\r\n[school_full_address]</p>\r\n\r\n<p>[visit_datetime]</p>\r\n\r\n<p>Please add pictures to social media and tag us!<br />\r\n@PIVLVP on Facebook, Twitter, and Instagram</p>\r\n\r\n<p>Please be sure to screen our <a href=\"https://www.poetryinvoice.com/welcome\">short introductory video</a> prior to the poet's visit.</p>\r\n\r\n<p><a href=\"https://www.poetryinvoice.com/welcome\"><img alt=\"\" data-entity-type=\"\" data-entity-uuid=\"\" src=\"http://poetryinvoice.lndo.site/sites/default/files/sites/all/themes/omega_pivlvp/images/still-frame-grey-icon.jpg\" style=\"width: 600px; height: 338px;\" /></a></p>\r\n\r\n<p>&nbsp;</p>\r\n\r\n<p>And also<span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;consider&nbsp;</span><a href=\"https://poetryinvoice.com/sites/default/files/PIV-Flyer.pdf\" style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">printing this flyer</a><span style=\"font-family: Arial, Helvetica, sans-serif; font-size: small;\">&nbsp;and hanging it in your classrooms and hallways to help promote our monthly poetry prize. Your students could win $100 and publication in our poetry journal VOICES/VOIX!</span></p>\r\n\r\n<p>&nbsp;</p>\r\n\r\n<p>Enjoy your poetry-filled day tomorrow.</p>\r\n\r\n<p>Yours sincerely,<br />\r\n[visit_admin]</p>\r\n"
    format: full_html
