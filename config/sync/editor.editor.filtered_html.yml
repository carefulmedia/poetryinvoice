uuid: 4e6e76fc-c5c2-4076-8b83-51692b908536
langcode: en
status: true
dependencies:
  config:
    - filter.format.filtered_html
  module:
    - ckeditor5
format: filtered_html
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - bold
      - italic
      - alignment
      - indent
      - outdent
      - '|'
      - drupalInsertImage
      - drupalMedia
      - '|'
      - link
      - anchor
      - '|'
      - blockQuote
      - code
      - bulletedList
      - numberedList
      - underline
      - strikethrough
      - superscript
      - subscript
      - horizontalLine
      - insertTable
      - '|'
      - sourceEditing
      - specialCharacters
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - justify
        - left
        - right
    ckeditor5_heading:
      enabled_headings:
        - heading1
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_imageResize:
      allow_resize: true
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<cite>'
        - '<dl>'
        - '<dt>'
        - '<dd>'
        - '<a hreflang name class>'
        - '<blockquote cite>'
        - '<table class>'
        - '<div id class>'
        - '<iframe allow allowfullscreen frameborder height src title width>'
        - '<p id>'
        - '<h1 class>'
    ckeditor_indentblock_indent:
      enable: true
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
    media_media:
      allow_view_mode_override: false
image_upload:
  status: true
  scheme: public
  directory: inline-images
  max_size: null
  max_dimensions:
    width: null
    height: null
