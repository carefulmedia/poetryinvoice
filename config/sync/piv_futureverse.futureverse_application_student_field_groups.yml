group_futureverse_application_20_label: 'FutureVerse Application 2027'
group_futureverse_application_20_description: |

  FutureVerse is our exciting program for talented high school student poets. Successful applicants will get an all-expenses-paid trip to Toronto from April 17-21, 2027, to spend several days meeting and working with famous authors, publishers, and other talented students.

  This poetry intensive will include workshops with celebrated poets on diverse topics. For a year after FutureVerse, you’ll also be meeting online to continue sharing, developing, and growing as a writer.

  If you have any questions about the program or this application, please email amanda@poetryinvoice.ca.

  <strong>The deadline for this form is February 28, 2027. No changes can be made after this date.</strong>
