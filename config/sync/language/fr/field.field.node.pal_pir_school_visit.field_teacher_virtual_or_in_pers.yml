label: 'Préférez-vous recevoir votre visite en personne ou à travers une plateforme virtuelle?'
description: "Les visites en personne durent un maximum de trois heures pendant lesquelles les poètes rencontrent deux groupes consécutifs. Une école peut demander une seule visite en personne par année. <br>Les visites virtuelles durent un maximum d’une heure. Une école peut demander deux visites virtuelles par année. <br>\r\nD’autres arrangements peuvent être discutés directement avec les poètes. \r\n"
