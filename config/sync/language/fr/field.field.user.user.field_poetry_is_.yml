label: 'La poésie, c’est'
description: '<b>Question supplémentaire</b> : remplissez la phrase ci-dessus. Voici deux exemples tirés de notre plan de cours intitulé <a href="http://www.lesvoixdelapoesie.com/enseignants/plans-de-cours/la-poesie-cest">« La poésie, c’est... »</a> : « La poésie, c’est un DJ en plein vol. » ou « La poésie, c’est comme faire du cheval sous la pluie... ». Osez un peu de poésie !'
