password_reset:
  subject: 'Un nouveau mot de passe pour [user:piv-teacher-first-name] [user:piv-teacher-last-name]'
  body: "Bonjour, \r\n\r\nCe message vous est envoyé, car vous avez fait la demande d’un nouveau mot de passe. \r\n\r\nVous pouvez maintenant vous connecter en cliquant sur le lien ci-dessous ou en le copiant et le collant dans votre navigateur :\r\n[user:one-time-login-url]\r\n\r\nCe lien ne sera valide qu’une seule fois. Il vous mènera vers une page où vous pourrez choisir un nouveau mot de passe. Le lien sera désactivé dans 24 heures. \r\n\r\nTrès cordialement, \r\n[site:name]\r\n"
register_admin_created:
  subject: 'You may begin judging the Online Qualifiers'
  body: "Dear [user:piv-teacher-first-name] [user:piv-teacher-last-name],\r\n\r\nWelcome to your account on the Poetry In Voice website. To log in please click on this link:\r\n[user:one-time-login-url]\r\n \r\nThe 2021 Poetry In Voice/Les voix de la poésie Senior Online Qualifiers judging period is now open.\r\n\r\n \r\n\r\nSETTING UP YOUR ACCOUNT\r\n\r\nYour judge’s account has been activated. Please follow this link to log in:\r\nLink TK\r\n\r\nPlease set your password after you log in if you haven't in the past.\r\n\r\n \r\n\r\nACCESSING YOUR ACCOUNT\r\n\r\nIn the future, you can log in by going to the Poetry In Voice homepage and clicking “Log in” in the upper right corner of your screen or by following this link:\r\nhttp://www.poetryinvoice.com/user\r\n\r\nForgot your password? You can retrieve it here:\r\nhttp://www.poetryinvoice.com/user/password\r\n\r\n \r\n\r\nJUDGING RECITATIONS\r\n\r\nAfter you log in, you can start judging by clicking on “Start judging,” also at the top of the screen. Take a few minutes to read the “How to judge the Online Contest” page before you begin.\r\n\r\nClick “Judge now” to begin a session.\r\n\r\nYou can leave a session at any time by clicking “Judge later” at the bottom of the screen. When you return, the system will take you back to where you stopped.\r\n\r\n \r\n\r\nDEADLINES\r\n\r\nThere are two judging periods this year. Please be sure to complete your work by our deadlines:\r\n\r\n1st period: March 5th –  March 9th\r\n\r\n2nd period: March 11th – March 17th @ 5pm (Pacific)\r\n\r\nYou may see student recitations that you judged in the 1st period again in the 2nd period; we ask you to judge these recitations afresh.\r\n\r\n \r\n\r\nTROUBLESHOOTING\r\n\r\nIf you are unable to complete a session or if you have any questions, please email or call David Smith at david@poetryinvoice.com, 514-668-0768 as soon as possible.\r\n\r\n \r\n\r\nThank you for joining us in encouraging students to learn poetry by heart.\r\n\r\nAll best,\r\n\r\nThe Poetry In Voice/Les voix de la poésie team***************************"
register_no_approval_required:
  subject: 'Confirmation d''ouverture de compte'
  body: "<p>Bonjour [user:piv-teacher-first-name] [user:piv-teacher-last-name],</p>\r\n<p>\r\n\tBienvenue parmi Les voix de la po&eacute;sie&thinsp;! Nous sommes un organisme de bienfaisance qui encourage les &eacute;l&egrave;ves de partout au Canada &agrave; vivre l&rsquo;aventure de la po&eacute;sie &agrave; travers la lecture, la r&eacute;citation et l&rsquo;&eacute;criture.</p>\r\n<p>\r\n\tMerci d&rsquo;avoir ouvert un compte sur notre site; celui-ci est maintenant actif.</p>\r\n<p>\r\n\tPour vous connecter, cliquez sur le lien ci-dessous ou copiez et collez-le dans votre navigateur (le lien ne fonctionnera qu&rsquo;une seule fois)&nbsp;:<br />\r\n[user:one-time-login-url]</p>\r\n<p>\r\n\tUne fois votre compte connect&eacute;, vous aurez acc&egrave;s &agrave; toutes nos ressources, qui demeurent toujours gratuites.</p>\r\n<ul>\r\n\t<li>\r\n\t\t<a href=\"https://lesvoixdelapoesie.ca/enseigner/poetes-lecole\">Demandez la visite d&rsquo;un(e) Po&egrave;te &agrave; l&rsquo;&eacute;cole</a></li>\r\n\t<li>\r\n\t\t<a href=\"https://lesvoixdelapoesie.ca/enseigner/plan-de-cours\">Acc&eacute;dez &agrave; nos plans de cours sur la po&eacute;sie</a></li>\r\n\t<li>\r\n\t\tOrganisez un <a href=\"https://lesvoixdelapoesie.ca/reciter/organiser-un-concours/dans-la-classe\">concours de r&eacute;citation</a> &agrave; partir de notre <a href=\"https://lesvoixdelapoesie.ca/lire\">anthologie</a></li>\r\n\t<li>\r\n\t\t<a href=\"https://lesvoixdelapoesie.ca/ecrire\">Utilisez nos exercices d&rsquo;&eacute;criture</a></li>\r\n</ul>\r\n<p>\r\n\tPour toute question, n&rsquo;h&eacute;sitez pas &agrave; nous &eacute;crire : info@lesvoixdelapoesie.ca.</p>\r\n<p>\r\n\tAu plaisir de travailler avec vous,</p>\r\n<p>\r\n\t&nbsp;</p>\r\n<p>\r\n\tL&rsquo;&eacute;quipe des Voix de la po&eacute;sie</p>\r\n"
register_pending_approval:
  subject: 'Demande d’ouverture de compte'
  body: "Nous vous remercions de votre demande d’ouverture de compte. Dès confirmation, nous vous enverrons un lien pour vous y connecter. \r\n\r\nTrès cordialement, \r\nLes voix de la poésie"
status_activated:
  body: "<p>Bonjour [user:piv-teacher-first-name] ,</p>\r\n<p>Merci de&nbsp;votre&nbsp;int&eacute;r&ecirc;t pour le programme Les voix de la po&eacute;sie! C'est&nbsp;un plaisir de savoir que vous souhaitez participer aux activit&eacute;s de notre programme.</p>\r\n<p>Votre&nbsp;compte&nbsp;est&nbsp;d&eacute;sormais&nbsp;actif. Vous pouvez y acc&eacute;der en cliquant sur le lien ci-dessous (notez que ce lien ne fonctionnera qu&rsquo;une seule fois) :[user:one-time-login-url]</p>\r\n<p>En vous connectant, vous aurez acc&egrave;s &agrave; plus d'information sur la page&nbsp;<a href=\"https://lesvoixdelapoesie.ca/propos/reseau-poetes\" target=\"_blank\" rel=\"noopener\">R&eacute;seau de po&egrave;tes</a>.</p>\r\n<p>La premi&egrave;re &eacute;tape pour faire partie du r&eacute;seau de po&egrave;te&nbsp;est&nbsp;de remplir tous les champs de&nbsp;votre&nbsp;compte. Une fois le&nbsp;compte&nbsp;ouvert, vous recevrez un virement Interac de 50 $ des Voix de la po&eacute;sie.</p>\r\n<p>Vous n'avez pas &agrave; remplir tous les champs d'un coup : vous pouvez cliquer sur &laquo;Enregistrer&raquo; et retourner dans&nbsp;votre&nbsp;compte&nbsp;quand bon vous semble. Par ailleurs, nous demandons que&nbsp;votre&nbsp;biographie comporte entre 100 et 150 mots ainsi que les tous points d&eacute;taill&eacute;s dans le&nbsp;<a href=\"https://lesvoixdelapoesie.ca/propos/reseau-poetes/guide-redaction\" target=\"_blank\" rel=\"noopener\">guide de r&eacute;daction, section &laquo;Biographie d'un&middot;e autre po&egrave;te</a>&raquo;.</p>\r\n<p>Pour voir un exemple de&nbsp;compte&nbsp;rempli, vous pouvez consulter les&nbsp;comptes&nbsp;d&eacute;j&agrave; actifs de po&egrave;tes sur notre site, comme <a href=\"https://lesvoixdelapoesie.ca/lire/poetes/marie-celie-agnant\" target=\"_blank\" rel=\"noopener\">Marie-C&eacute;lie Agnant</a>), ou encore <a href=\"http://lesvoixdelapoesie.ca/lire/poetes/nicole-brossard\" target=\"_blank\" rel=\"noopener\">Nicole Brossard</a>).</p>\r\n<p>N'h&eacute;sitez pas &agrave; nous r&eacute;&eacute;crire s'il y a quoi que ce soit.</p>\r\n<p>Cordialement,</p>\r\n<p>L'&eacute;quipe des Voix de la po&eacute;sie</p>\r\n\r\n"
  subject: 'Confirmation d''ouverture de compte'
status_blocked:
  body: "Dear [user:piv-teacher-first-name] [user:piv-teacher-last-name],\r\n\r\nYour account on [site:name] has been blocked.\r\n\r\nPlease contact us at webmaster@poetryinvoice.com if you believe that your account was blocked by mistake. \r\n\r\nThank you, \r\nPoetry In Voice"
