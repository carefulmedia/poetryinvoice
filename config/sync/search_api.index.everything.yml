uuid: 85503b7a-1989-4f8e-9a31-f30a0768b45a
langcode: en
status: true
dependencies:
  config:
    - field.storage.node.body
    - field.storage.user.field_user_bio
    - field.storage.user.field_bio_trans
    - search_api.server.solr
    - core.entity_view_mode.node.poem
  module:
    - search_api_solr
    - node
    - search_api
    - user
third_party_settings:
  search_api_solr:
    finalize: false
    commit_before_finalize: false
    commit_after_finalize: false
    debug_finalize: false
    highlighter:
      maxAnalyzedChars: 51200
      fragmenter: gap
      usePhraseHighlighter: true
      highlightMultiTerm: true
      preserveMulti: true
      regex:
        slop: 0.5
        pattern: blank
        maxAnalyzedChars: 10000
      highlight:
        mergeContiguous: false
        requireFieldMatch: false
        snippets: 3
        fragsize: 0
    mlt:
      mintf: 1
      mindf: 1
      maxdf: 0
      maxdfpct: 0
      minwl: 0
      maxwl: 0
      maxqt: 100
      maxntp: 2000
      boost: false
      interestingTerms: none
    term_modifiers:
      slop: 3
      fuzzy: 1
    advanced:
      index_prefix: ''
      collection: ''
      timezone: ''
    multilingual:
      limit_to_content_language: false
      include_language_independent: true
      use_language_undefined_as_fallback_language: true
      specific_languages:
        en: '0'
        fr: '0'
      use_universal_collation: true
id: everything
name: 'Search Everything'
description: ''
read_only: false
field_settings:
  body:
    label: Body
    datasource_id: 'entity:node'
    property_path: body
    type: text
    dependencies:
      config:
        - field.storage.node.body
  entity_type:
    label: 'Entity type'
    property_path: search_api_entity_type
    type: solr_string_storage
  field_bio_trans:
    label: 'Bio translation » Processed text'
    datasource_id: 'entity:user'
    property_path: 'field_bio_trans:processed'
    type: text
    dependencies:
      config:
        - field.storage.user.field_bio_trans
  field_user_bio:
    label: 'Biography » Processed text'
    datasource_id: 'entity:user'
    property_path: 'field_user_bio:processed'
    type: text
    dependencies:
      config:
        - field.storage.user.field_user_bio
  full_name:
    label: 'Full name'
    datasource_id: 'entity:user'
    property_path: dummy_field
    type: solr_string_storage
    boost: !!float 8
    configuration:
      dummy_value: dummy
  full_name_searchable:
    label: 'Searchable full name'
    datasource_id: 'entity:user'
    property_path: dummy_field
    type: text
    boost: !!float 21
    configuration:
      dummy_value: dummy
  node_grants:
    label: 'Node access information'
    property_path: search_api_node_grants
    type: string
    indexed_locked: true
    type_locked: true
    hidden: true
  poem_author:
    label: 'Poem author'
    datasource_id: 'entity:node'
    property_path: dummy_field
    type: text
    boost: !!float 5
    configuration:
      dummy_value: dummy
  rendered_item:
    label: 'Rendered HTML output'
    property_path: rendered_item
    type: text
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:node':
          article: default
          bulletin_board: ''
          event: ''
          faq: ''
          journal_poem: ''
          mixtape: ''
          page: default
          podcast: ''
          poem: poem
          poll: ''
          power_points: ''
          press_release: ''
          school: ''
          student: ''
          video: ''
          writing_prompt: ''
        'entity:user':
          user: default
  status:
    label: status
    datasource_id: 'entity:node'
    property_path: status
    type: boolean
    indexed_locked: true
    type_locked: true
    dependencies:
      module:
        - node
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: text
    dependencies:
      module:
        - node
  uid:
    label: uid
    datasource_id: 'entity:node'
    property_path: uid
    type: integer
    indexed_locked: true
    type_locked: true
    dependencies:
      module:
        - node
  url:
    label: URI
    property_path: search_api_url
    type: string
    configuration:
      absolute: false
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - article
        - bulletin_board
        - event
        - faq
        - journal_poem
        - mixtape
        - page
        - podcast
        - poem
        - poll
        - power_points
        - press_release
        - school
        - student
        - video
        - writing_prompt
    languages:
      default: true
      selected: {  }
  'entity:user':
    languages:
      default: true
      selected: {  }
