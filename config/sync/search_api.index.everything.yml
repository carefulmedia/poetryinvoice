      - pic_pal
      - poet
      - poet_network
  stemmer:
    weights:
      preprocess_index: 0
      preprocess_query: 0
    all_fields: false
    fields:
      - rendered_item
    exceptions:
      mexican: mexic
      texan: texa
  tokenizer:
