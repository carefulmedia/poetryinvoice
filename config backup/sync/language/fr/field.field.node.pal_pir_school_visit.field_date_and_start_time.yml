label: 'Date et heure préférées'
description: 'L’heure de début que vous préférez pour une visite. Cela devrait être 15 minutes avant le début d’un cours. Nous payons une visite d’une durée maximale de 3 heures consécutives dans une même école. Si vous souhaitez qu’une personne reste plus longtemps, vous pouvez négocier avec elle directement. '
