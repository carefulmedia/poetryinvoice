# The routes of the project.
#
# Each route describes how an incoming URL is going
# to be processed by Platform.sh.

"https://{default}/":
    type: upstream
    upstream: "app:http"
    cache:
        enabled: true

        # Base the cache on the session cookie and custom Drupal cookies. Ignore all other cookies.
        cookies: ['/^SS?ESS/', '/^Drupal.visitor/']
    redirects:
        expires: 1d
        paths:
            # Redirects to s3.
            '^sites/default/files/(.*)$':
                to: 'https://piv-prod.s3.ca-central-1.amazonaws.com/public/$1'
                regexp: true
            '^downloads/(.*)$':
                to: 'https://piv-prod.s3.ca-central-1.amazonaws.com/downloads/$1'
                regexp: true
            '^images/(.*)$':
                to: 'https://piv-prod.s3.ca-central-1.amazonaws.com/images/$1'
                regexp: true
            '^telechargements/(.*)$':
                to: 'https://piv-prod.s3.ca-central-1.amazonaws.com/telechargements/$1'
                regexp: true

"https://www.{default}/":
    type: redirect
    to: "https://{default}/"
